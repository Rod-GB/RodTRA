# Configuration: render.yaml
# Folder: Project root
# File: render.yaml
# Purpose: Describes the existing Render Docker web service.

# the secret values are entered in Render, never saved in GitHub.
services:
  - type: web
    name: rodtra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
